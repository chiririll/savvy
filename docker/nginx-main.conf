# Главный конфиг nginx под non-root: pid и temp-пути в /tmp, логи в stdout/stderr,
# без директивы `user` (воркеры наследуют пользователя мастера = www-data).
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # Один уровень под /tmp: nginx создаёт только листовую директорию, поэтому
    # родитель должен существовать (/tmp есть всегда).
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    include /etc/nginx/http.d/*.conf;
}
